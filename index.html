<!DOCTYPE html>
<html lang="en" data-theme="glass">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masterclass Contact</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        glassBase: '#0a0a0f',
                        neuBase: '#13141a',
                    },
                    transitionTimingFunction: {
                        'spring': 'cubic-bezier(0.68, -0.55, 0.265, 1.55)',
                        'smooth': 'cubic-bezier(0.4, 0, 0.2, 1)',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.google.com/recaptcha/enterprise.js?render=6LdTMBYuAAAAAGUZD2Iy6lFprt3IXAKuEOe3cWyV" async defer></script>
    <style>
        :root {
            --bg-color: #0a0a0f;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: #f3f4f6;
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        /* --- GOD-TIER GLASSMORPHISM --- */
        [data-theme="glass"] {
            --bg-color: #050508;
            background: radial-gradient(circle at 50% -20%, #1a1c3a 0%, #050508 70%);
        }
        [data-theme="glass"] .theme-container {
            background: rgba(15, 17, 26, 0.5);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        [data-theme="glass"] .theme-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }
        [data-theme="glass"] .theme-input:focus-within {
            border-color: rgba(99, 102, 241, 0.8);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15), inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        /* --- GOD-TIER NEUMORPHISM --- */
        [data-theme="neu"] {
            --bg-color: #13141a;
        }
        [data-theme="neu"] .theme-container {
            background: var(--bg-color);
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 20px 20px 40px #0c0d11, -20px -20px 40px #1a1b23;
        }
        [data-theme="neu"] .theme-input {
            background: var(--bg-color);
            border: 1px solid rgba(255, 255, 255, 0.01);
            box-shadow: inset 6px 6px 12px #0c0d11, inset -6px -6px 12px #1a1b23;
        }
        [data-theme="neu"] .theme-input:focus-within {
            box-shadow: inset 8px 8px 16px #0c0d11, inset -8px -8px 16px #1a1b23, 0 0 0 2px rgba(99, 102, 241, 0.4);
        }

        /* --- SMOOTH TOGGLE & EXPANSION CSS --- */
        .grid-expand {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .grid-expand.is-open {
            grid-template-rows: 1fr;
        }
        .grid-inner {
            overflow: hidden;
        }

        .toggle-knob {
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55), background-color 0.3s;
        }
        input:checked ~ .toggle-bg {
            background-color: #6366f1;
        }
        input:checked ~ .toggle-bg .toggle-knob {
            transform: translateX(20px);
        }

        /* --- MORPHING BUTTON ANIMATION --- */
        .btn-content, .btn-loader, .btn-success {
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-loader, .btn-success {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
            pointer-events: none;
        }
        
        .submit-btn.is-loading .btn-content {
            opacity: 0;
            transform: scale(0.95);
        }
        .submit-btn.is-loading .btn-loader {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .submit-btn.is-success .btn-loader {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.8);
        }
        .submit-btn.is-success .btn-success {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .custom-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modal Animations */
        .modal-svg-check {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
        }
        .modal-active .modal-svg-check {
            animation: drawCheck 0.8s cubic-bezier(0.65, 0, 0.45, 1) forwards 0.2s;
        }
        @keyframes drawCheck { 100% { stroke-dashoffset: 0; } }

        .modal-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(99, 102, 241, 0.6);
            transform: scale(0.8);
            opacity: 0;
        }
        .modal-active .modal-ring {
            animation: ringPulse 1.2s cubic-bezier(0.21, 0.53, 0.56, 1) forwards;
        }
        @keyframes ringPulse {
            0% { transform: scale(0.8); opacity: 1; border-width: 4px; }
            100% { transform: scale(1.8); opacity: 0; border-width: 0px; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative">

    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/10 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/10 rounded-full blur-[120px]"></div>
    </div>

    <header class="relative z-20 mb-6 w-full max-w-xl flex justify-end px-2">
        <div class="flex items-center gap-1 p-1.5 rounded-2xl theme-container transition-all">
            <button type="button" data-theme-btn="glass" class="px-4 py-2 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-lg cursor-pointer">Glass</button>
            <button type="button" data-theme-btn="neu" class="px-4 py-2 rounded-xl text-xs font-bold transition-all opacity-50 hover:opacity-100 cursor-pointer">Neu</button>
        </div>
    </header>

    <main class="w-full max-w-xl relative z-10">
        
        <div class="theme-container rounded-3xl p-6 sm:p-10 relative transition-all duration-500">
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-500 opacity-50"></div>

            <div class="mb-8 flex items-start justify-between">
                <h1 class="text-3xl font-extrabold tracking-tight">Masterclass Contact</h1>
                <div class="theme-input px-4 py-2 rounded-2xl flex items-center gap-2 select-none">
                    <div class="text-xs font-bold font-mono tracking-wider opacity-80" id="localTimeDisplay">--:--</div>
                </div>
            </div>

            <!-- Form -->
            <form id="contactForm" enctype="multipart/form-data" class="space-y-6" novalidate>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="space-y-2">
                        <label for="firstName" class="block text-[11px] font-extrabold tracking-widest uppercase opacity-60">First Name</label>
                        <div class="theme-input rounded-2xl flex items-center px-4 py-3.5 transition-all">
                            <input type="text" id="firstName" name="first_name" required maxlength="40" placeholder="John" class="w-full bg-transparent border-none outline-none text-sm placeholder-gray-600">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label for="lastName" class="block text-[11px] font-extrabold tracking-widest uppercase opacity-60">Last Name</label>
                        <div class="theme-input rounded-2xl flex items-center px-4 py-3.5 transition-all">
                            <input type="text" id="lastName" name="last_name" required maxlength="40" placeholder="Doe" class="w-full bg-transparent border-none outline-none text-sm placeholder-gray-600">
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="email" class="block text-[11px] font-extrabold tracking-widest uppercase opacity-60">Email</label>
                    <div class="theme-input rounded-2xl flex items-center px-4 py-3.5 transition-all">
                        <input type="email" id="email" name="email" required maxlength="100" placeholder="john@example.com" class="w-full bg-transparent border-none outline-none text-sm placeholder-gray-600">
                    </div>
                </div>

                <!-- Preferred Contact Method & Phone Expansion -->
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="block text-[11px] font-extrabold tracking-widest uppercase opacity-60">Reply Via</label>
                        <!-- Segmented Toggle -->
                        <div class="flex bg-white/5 p-1 rounded-xl">
                            <label class="cursor-pointer">
                                <input type="radio" name="contact_method" value="Email" class="hidden peer contact-method-radio" checked>
                                <div class="px-3 py-1 text-[10px] font-bold uppercase tracking-wider rounded-lg opacity-50 peer-checked:opacity-100 peer-checked:bg-indigo-600 peer-checked:text-white transition-all">Email</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="contact_method" value="Phone" class="hidden peer contact-method-radio">
                                <div class="px-3 py-1 text-[10px] font-bold uppercase tracking-wider rounded-lg opacity-50 peer-checked:opacity-100 peer-checked:bg-indigo-600 peer-checked:text-white transition-all">Phone</div>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Expandable Phone Area -->
                    <div id="phoneArea" class="grid-expand">
                        <div class="grid-inner">
                            <div class="flex gap-3 pt-1">
                                <div class="theme-input rounded-2xl flex items-center px-3 py-3.5 transition-all w-24">
                                    <input type="text" id="countryCode" name="country_code" placeholder="+977" class="w-full bg-transparent border-none outline-none text-sm placeholder-gray-600 text-center font-mono">
                                </div>
                                <div class="theme-input rounded-2xl flex items-center px-4 py-3.5 transition-all flex-1">
                                    <input type="tel" id="phoneNumber" name="phone_number" placeholder="98XXXXXXXX" class="w-full bg-transparent border-none outline-none text-sm placeholder-gray-600">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Urgency Toggle Pills -->
                <div class="space-y-2">
                    <label class="block text-[11px] font-extrabold tracking-widest uppercase opacity-60">Urgency Level</label>
                    <div class="flex gap-2">
                        <label class="cursor-pointer flex-1 group">
                            <input type="radio" name="urgency" value="Low" class="hidden peer">
                            <div class="theme-input py-2.5 text-center rounded-xl text-[11px] font-bold uppercase tracking-wider opacity-60 group-hover:opacity-80 peer-checked:opacity-100 peer-checked:bg-emerald-500/15 peer-checked:text-emerald-400 peer-checked:border-emerald-500/40 transition-all border border-transparent">Low</div>
                        </label>
                        <label class="cursor-pointer flex-1 group">
                            <input type="radio" name="urgency" value="Normal" class="hidden peer" checked>
                            <div class="theme-input py-2.5 text-center rounded-xl text-[11px] font-bold uppercase tracking-wider opacity-60 group-hover:opacity-80 peer-checked:opacity-100 peer-checked:bg-indigo-500/15 peer-checked:text-indigo-400 peer-checked:border-indigo-500/40 transition-all border border-transparent">Normal</div>
                        </label>
                        <label class="cursor-pointer flex-1 group">
                            <input type="radio" name="urgency" value="High" class="hidden peer">
                            <div class="theme-input py-2.5 text-center rounded-xl text-[11px] font-bold uppercase tracking-wider opacity-60 group-hover:opacity-80 peer-checked:opacity-100 peer-checked:bg-rose-500/15 peer-checked:text-rose-400 peer-checked:border-rose-500/40 transition-all border border-transparent">High</div>
                        </label>
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label for="message" class="block text-[11px] font-extrabold tracking-widest uppercase opacity-60">Message</label>
                        <span id="charCounter" class="text-[11px] opacity-40 font-mono">0/500</span>
                    </div>
                    <div class="theme-input rounded-2xl p-4 transition-all">
                        <textarea id="message" name="message" required rows="4" maxlength="500" placeholder="How can we help?" class="w-full bg-transparent border-none outline-none text-sm placeholder-gray-600 resize-none"></textarea>
                    </div>
                </div>

                <!-- Custom File Upload Toggle -->
                <div class="pt-2">
                    <label class="inline-flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="fileToggle" class="hidden">
                        <div class="toggle-bg w-10 h-6 bg-white/10 rounded-full p-1 transition-colors group-hover:bg-white/20">
                            <div class="toggle-knob w-4 h-4 bg-white rounded-full"></div>
                        </div>
                        <span class="text-[11px] font-extrabold tracking-widest uppercase opacity-60 group-hover:opacity-100 transition-opacity">Attach File</span>
                    </label>

                    <!-- Expandable File Area -->
                    <div id="fileArea" class="grid-expand mt-3">
                        <div class="grid-inner">
                            <div class="theme-input rounded-2xl border-dashed border-2 border-indigo-500/30 p-6 text-center transition-all hover:border-indigo-500/60 relative cursor-pointer group">
                                <input type="file" id="attachment" name="attachment" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg">
                                <div class="flex flex-col items-center gap-2 pointer-events-none">
                                    <div class="w-10 h-10 rounded-full bg-indigo-500/10 flex items-center justify-center text-indigo-400 group-hover:scale-110 transition-transform">
                                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <p class="text-sm font-bold text-indigo-400" id="fileNameDisplay">Click or drag file to upload</p>
                                        <p class="text-[10px] opacity-50 mt-1 uppercase tracking-wider">Max 10MB (PDF, Image, Word)</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Animated Morphing Button -->
                <button type="submit" id="submitBtn" class="submit-btn w-full relative group overflow-hidden rounded-2xl font-bold text-sm shadow-xl transition-all cursor-pointer h-14 bg-indigo-600 hover:bg-indigo-500 text-white mt-2">
                    
                    <!-- Content -->
                    <div class="btn-content w-full h-full flex items-center justify-center gap-2">
                        <span>Send Transmission</span>
                        <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </div>
                    
                    <!-- Spinner -->
                    <div class="btn-loader">
                        <div class="custom-spinner"></div>
                    </div>

                    <!-- Success State -->
                    <div class="btn-success">
                        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                </button>
            </form>

        </div>
    </main>

    <!-- God-Tier Modal -->
    <div id="successModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-500">
        <div class="theme-container w-full max-w-sm rounded-3xl p-8 text-center relative transform scale-90 translate-y-8 transition-all duration-500" id="successCard">
            
            <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center relative">
                <div class="modal-ring"></div>
                <svg class="w-10 h-10 text-indigo-400 modal-svg-check" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 13l4 4L19 7"></path>
                </svg>
            </div>

            <h3 class="text-xl font-extrabold mb-2">Transmission Sent</h3>
            <p class="text-sm opacity-50 mb-8">Your message and details have securely landed in our inbox.</p>

            <button id="modalDoneBtn" class="w-full py-3.5 px-6 rounded-2xl bg-white/10 hover:bg-white/20 font-bold text-sm transition-colors cursor-pointer">
                Close
            </button>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme Switcher
            const themeButtons = document.querySelectorAll('[data-theme-btn]');
            const htmlElement = document.documentElement;

            const setTheme = (themeName) => {
                htmlElement.setAttribute('data-theme', themeName);
                themeButtons.forEach(btn => {
                    if (btn.getAttribute('data-theme-btn') === themeName) {
                        btn.className = 'px-4 py-2 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-lg cursor-pointer';
                    } else {
                        btn.className = 'px-4 py-2 rounded-xl text-xs font-bold transition-all opacity-50 hover:opacity-100 cursor-pointer theme-input';
                    }
                });
                localStorage.setItem('mc_theme', themeName);
            };

            setTheme(localStorage.getItem('mc_theme') || 'glass');

            themeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    setTheme(btn.getAttribute('data-theme-btn'));
                    if(navigator.vibrate) navigator.vibrate(10);
                });
            });

            // Time Display
            const localTimeDisplay = document.getElementById('localTimeDisplay');
            const updateLocalTime = () => {
                const now = new Date();
                const h = now.getHours();
                const m = now.getMinutes().toString().padStart(2, '0');
                localTimeDisplay.textContent = `${h % 12 || 12}:${m} ${h >= 12 ? 'PM' : 'AM'}`;
            };
            updateLocalTime();
            setInterval(updateLocalTime, 30000);

            // Contact Method Expand Logic
            const contactMethodRadios = document.querySelectorAll('.contact-method-radio');
            const phoneArea = document.getElementById('phoneArea');
            const countryCodeInput = document.getElementById('countryCode');
            const phoneNumberInput = document.getElementById('phoneNumber');

            contactMethodRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'Phone') {
                        phoneArea.classList.add('is-open');
                    } else {
                        phoneArea.classList.remove('is-open');
                    }
                });
            });

            // File Upload UI Logic
            const fileToggle = document.getElementById('fileToggle');
            const fileArea = document.getElementById('fileArea');
            const fileInput = document.getElementById('attachment');
            const fileNameDisplay = document.getElementById('fileNameDisplay');

            fileToggle.addEventListener('change', (e) => {
                if (e.target.checked) {
                    fileArea.classList.add('is-open');
                } else {
                    fileArea.classList.remove('is-open');
                    fileInput.value = ''; 
                    fileNameDisplay.textContent = 'Click or drag file to upload';
                    fileNameDisplay.classList.remove('text-emerald-400');
                    fileNameDisplay.classList.add('text-indigo-400');
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    const file = e.target.files[0];
                    if(file.size > 10 * 1024 * 1024) {
                        showToast('File must be less than 10MB', 'error');
                        fileInput.value = '';
                        return;
                    }
                    fileNameDisplay.textContent = file.name;
                    fileNameDisplay.classList.remove('text-indigo-400');
                    fileNameDisplay.classList.add('text-emerald-400');
                }
            });

            // Form Logic
            const form = document.getElementById('contactForm');
            const messageInput = document.getElementById('message');
            const charCounter = document.getElementById('charCounter');
            const submitBtn = document.getElementById('submitBtn');
            const successModal = document.getElementById('successModal');
            const successCard = document.getElementById('successCard');

            messageInput.addEventListener('input', () => {
                charCounter.textContent = `${messageInput.value.length}/500`;
                charCounter.style.color = messageInput.value.length > 450 ? '#f43f5e' : '';
            });

            const showToast = (message, type = 'success') => {
                const toast = document.createElement('div');
                toast.className = `pointer-events-auto px-4 py-3 rounded-2xl theme-container text-xs font-bold shadow-2xl flex items-center gap-3 transform translate-y-4 opacity-0 transition-all duration-300 border ${type === 'error' ? 'border-rose-500/50 text-rose-400' : 'border-indigo-500/50 text-indigo-400'}`;
                toast.textContent = message;
                document.getElementById('toastContainer').appendChild(toast);
                requestAnimationFrame(() => toast.classList.remove('translate-y-4', 'opacity-0'));
                setTimeout(() => {
                    toast.classList.add('translate-y-4', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            };

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                if(navigator.vibrate) navigator.vibrate(15);

                const requiredIds = ['firstName', 'lastName', 'email', 'message'];
                if(requiredIds.some(id => !document.getElementById(id).value.trim())) {
                    return showToast('Please fill all required standard fields.', 'error');
                }

                const selectedMethod = document.querySelector('.contact-method-radio:checked').value;
                if (selectedMethod === 'Phone') {
                    if (!countryCodeInput.value.trim() || !phoneNumberInput.value.trim()) {
                        return showToast('Please enter Country Code and Phone Number.', 'error');
                    }
                }

                // Sequence 1: Loading
                submitBtn.classList.add('is-loading');

                try {
                    if (typeof grecaptcha !== 'undefined' && grecaptcha.enterprise) {
                        await new Promise(resolve => grecaptcha.enterprise.ready(async () => resolve(await grecaptcha.enterprise.execute('6LdTMBYuAAAAAGUZD2Iy6lFprt3IXAKuEOe3cWyV', { action: 'submit' }))));
                    }

                    // Native FormData pointing to the STANDARD endpoint (No /ajax/ path to prevent stripping files)
                    const formData = new FormData(form);
                    formData.append("_subject", "New Submission: Masterclass Contact");
                    formData.append("_template", "box");
                    formData.append("_captcha", "false");
                    
                    if (!fileToggle.checked) formData.delete('attachment');
                    if (selectedMethod === 'Email') {
                        formData.delete('country_code');
                        formData.delete('phone_number');
                    }

                    // Fetch using the base URL + specific Accept header for JSON response
                    const response = await fetch('https://formsubmit.co/koirala57111@gmail.com', {
                        method: 'POST',
                        headers: { 'Accept': 'application/json' },
                        body: formData
                    });

                    if (response.ok) {
                        // Sequence 2: Success Tick
                        submitBtn.classList.remove('is-loading');
                        submitBtn.classList.add('is-success');
                        
                        setTimeout(() => {
                            // Sequence 3: Open God-Tier Modal
                            successModal.classList.remove('opacity-0', 'pointer-events-none');
                            successModal.classList.add('modal-active');
                            successCard.classList.remove('scale-90', 'translate-y-8');
                            
                            form.reset();
                            charCounter.textContent = '0/500';
                            if(fileToggle.checked) fileToggle.click(); // Reset file UI
                            if(selectedMethod === 'Phone') {
                                document.querySelector('input[value="Email"]').checked = true; // Reset back to Email Default
                                phoneArea.classList.remove('is-open');
                            }
                            
                            setTimeout(() => submitBtn.classList.remove('is-success'), 500);
                        }, 800);
                    } else {
                        throw new Error();
                    }
                } catch (error) {
                    showToast('Submission failed. Check network.', 'error');
                    submitBtn.classList.remove('is-loading');
                }
            });

            const closeModal = () => {
                successModal.classList.remove('modal-active');
                successModal.classList.add('opacity-0', 'pointer-events-none');
                successCard.classList.add('scale-90', 'translate-y-8');
            };

            document.getElementById('modalDoneBtn').addEventListener('click', closeModal);
            successModal.addEventListener('click', (e) => { if (e.target === successModal) closeModal(); });
        });
    </script>
</body>
</html>
