<!DOCTYPE html>
<html lang="en" class="dark" data-theme="glass">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masterclass Contact</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#050508',
                        darkSurface: '#0d0e15',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Google reCAPTCHA Enterprise API -->
    <script src="https://www.google.com/recaptcha/enterprise.js?render=6LdTMBYuAAAAAGUZD2Iy6lFprt3IXAKuEOe3cWyV" async defer></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050508;
            color: #f3f4f6;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- THEME 1: GLASSMORPHISM --- */
        [data-theme="glass"] {
            background: radial-gradient(circle at 50% 0%, #15182e 0%, #050508 70%);
        }
        [data-theme="glass"] .custom-container {
            background: rgba(18, 20, 32, 0.65);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        [data-theme="glass"] .custom-control {
            background: rgba(10, 11, 18, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
            color: #f3f4f6;
        }
        [data-theme="glass"] .custom-control:focus-within {
            border-color: rgba(99, 102, 241, 0.7);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* --- THEME 2: DARK NEUMORPHISM --- */
        [data-theme="neumorph"] {
            background-color: #12141c;
            color: #e5e7eb;
        }
        [data-theme="neumorph"] .custom-container {
            background: #12141c;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 16px 16px 32px #0a0b10, -16px -16px 32px #1a1e28;
            backdrop-filter: none;
        }
        [data-theme="neumorph"] .custom-control {
            background: #12141c;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: inset 5px 5px 10px #0a0b10, inset -5px -5px 10px #1a1e28;
            color: #e5e7eb;
        }
        [data-theme="neumorph"] .custom-control:focus-within {
            box-shadow: inset 6px 6px 12px #0a0b10, inset -6px -6px 12px #1a1e28, 0 0 0 2px rgba(99, 102, 241, 0.6);
        }

        /* --- THEME 3: MINIMALIST DARK OLED --- */
        [data-theme="minimal"] {
            background-color: #000000;
        }
        [data-theme="minimal"] .custom-container {
            background: #060608;
            border: 1px solid #1f1f2e;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
            backdrop-filter: none;
        }
        [data-theme="minimal"] .custom-control {
            background: #020203;
            border: 1px solid #28283d;
            box-shadow: none;
            color: #ffffff;
        }
        [data-theme="minimal"] .custom-control:focus-within {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
        }

        /* --- HEAVY CSS ANIMATIONS --- */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle 14s infinite linear;
        }
        @keyframes floatParticle {
            0% { transform: translateY(0px) translateX(0px) rotate(0deg); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-800px) translateX(200px) rotate(360deg); opacity: 0; }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.25; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.08); }
        }
        .ambient-glow-1 { animation: pulseGlow 9s ease-in-out infinite; }
        .ambient-glow-2 { animation: pulseGlow 11s ease-in-out infinite 3s; }

        /* Custom Animated Submit Button Sequence */
        .submit-btn {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .submit-btn.is-sending {
            pointer-events: none;
            transform: scale(0.98);
        }
        .plane-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: none;
        }
        .submit-btn.is-success .plane-wrapper {
            opacity: 1;
            animation: flyAway 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes flyAway {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            30% { transform: translate(-10%, -60%) scale(1.2) rotate(15deg); opacity: 1; }
            100% { transform: translate(400px, -250px) scale(0.5) rotate(45deg); opacity: 0; }
        }

        /* Modal SVG Drawing Animation */
        .svg-check {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
        }
        .modal-active .svg-check {
            animation: drawCheck 0.8s cubic-bezier(0.65, 0, 0.45, 1) forwards;
            animation-delay: 0.3s;
        }
        @keyframes drawCheck {
            0% { stroke-dashoffset: 100; }
            100% { stroke-dashoffset: 0; }
        }

        /* Success Rings Animation */
        .success-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(99, 102, 241, 0.5);
            opacity: 0;
            transform: scale(0.8);
        }
        .modal-active .success-ring {
            animation: ringPulse 1.5s cubic-bezier(0.21, 0.53, 0.56, 1) forwards;
        }
        @keyframes ringPulse {
            0% { transform: scale(0.8); opacity: 1; border-width: 4px; }
            100% { transform: scale(2); opacity: 0; border-width: 0px; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative">

    <!-- Particle Container -->
    <div id="particleContainer" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- Ambient BG -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="ambient-glow-1 absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-[150px]"></div>
        <div class="ambient-glow-2 absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/15 rounded-full blur-[150px]"></div>
    </div>

    <!-- Theme Switcher -->
    <header class="relative z-20 mb-6 w-full max-w-xl flex items-center justify-between px-2">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-indigo-500 animate-ping"></div>
            <span class="text-xs font-mono uppercase tracking-widest opacity-60">Interface</span>
        </div>
        
        <div class="flex items-center gap-1 p-1 rounded-2xl custom-container shadow-md transition-all">
            <button type="button" data-theme-btn="glass" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-indigo-600 text-white shadow-lg cursor-pointer">Glass</button>
            <button type="button" data-theme-btn="neumorph" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition-all opacity-60 hover:opacity-100 cursor-pointer">Neumorph</button>
            <button type="button" data-theme-btn="minimal" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition-all opacity-60 hover:opacity-100 cursor-pointer">Minimal</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-xl relative z-10">
        
        <div class="custom-container rounded-3xl p-6 sm:p-10 relative overflow-hidden transition-all duration-500">
            
            <div class="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>

            <div class="mb-8 flex items-start justify-between">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Let's connect</h1>
                </div>

                <!-- Minimal Time Widget -->
                <div class="custom-control px-3.5 py-2.5 rounded-2xl flex items-center gap-2.5 select-none">
                    <div class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></div>
                    <div class="text-xs font-bold font-mono tracking-wider" id="localTimeDisplay">--:--</div>
                </div>
            </div>

            <!-- Form configured using FormSubmit.co AJAX endpoint -->
            <form id="contactForm" class="space-y-5" novalidate>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label for="firstName" class="block text-xs font-bold tracking-wider uppercase opacity-75">First Name</label>
                        <div class="custom-control rounded-2xl flex items-center px-4 py-3.5 transition-all">
                            <input 
                                type="text" 
                                id="firstName" 
                                required 
                                maxlength="40"
                                placeholder="John" 
                                class="w-full bg-transparent border-none outline-none text-sm placeholder-gray-500"
                            >
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label for="lastName" class="block text-xs font-bold tracking-wider uppercase opacity-75">Last Name</label>
                        <div class="custom-control rounded-2xl flex items-center px-4 py-3.5 transition-all">
                            <input 
                                type="text" 
                                id="lastName" 
                                required 
                                maxlength="40"
                                placeholder="Doe" 
                                class="w-full bg-transparent border-none outline-none text-sm placeholder-gray-500"
                            >
                        </div>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="email" class="block text-xs font-bold tracking-wider uppercase opacity-75">Email Address</label>
                    <div class="custom-control rounded-2xl flex items-center px-4 py-3.5 transition-all">
                        <input 
                            type="email" 
                            id="email" 
                            required 
                            maxlength="100"
                            placeholder="john.doe@example.com" 
                            class="w-full bg-transparent border-none outline-none text-sm placeholder-gray-500"
                        >
                    </div>
                </div>

                <div class="space-y-1.5">
                    <div class="flex items-center justify-between">
                        <label for="message" class="block text-xs font-bold tracking-wider uppercase opacity-75">Message</label>
                        <span id="charCounter" class="text-xs opacity-50 font-mono">0 / 500</span>
                    </div>
                    <div class="custom-control rounded-2xl p-4 transition-all">
                        <textarea 
                            id="message" 
                            required 
                            rows="4" 
                            maxlength="500"
                            placeholder="Write your message here (min 10 characters)..." 
                            class="w-full bg-transparent border-none outline-none text-sm placeholder-gray-500 resize-none"
                        ></textarea>
                    </div>
                </div>

                <div class="pt-1">
                    <div class="custom-control p-3.5 rounded-2xl flex items-center justify-between select-none">
                        <div class="flex items-center gap-3">
                            <div class="w-5 h-5 rounded-md border border-indigo-500 bg-indigo-600/20 flex items-center justify-center">
                                <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                                </svg>
                            </div>
                            <span class="text-xs font-medium opacity-90">Protected by Google reCAPTCHA Enterprise</span>
                        </div>
                    </div>
                </div>

                <!-- Animated Custom Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="submit-btn w-full relative group overflow-hidden rounded-2xl p-px font-bold text-sm shadow-xl cursor-pointer"
                >
                    <span class="absolute inset-0 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 group-hover:opacity-90 transition-opacity"></span>
                    <span class="relative flex items-center justify-center gap-2 px-6 py-4 rounded-[15px] bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-inner h-14">
                        
                        <!-- Default Text -->
                        <div id="btnContent" class="flex items-center gap-2 transition-all duration-300">
                            <span>Send Message</span>
                            <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                            </svg>
                        </div>
                        
                        <!-- Loading Spinner -->
                        <div id="btnSpinner" class="absolute inset-0 flex items-center justify-center opacity-0 transition-opacity duration-300">
                            <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </div>

                        <!-- Paper Plane Animation -->
                        <div class="plane-wrapper">
                            <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                            </svg>
                        </div>

                    </span>
                </button>
            </form>

        </div>
    </main>

    <!-- Success Modal with SVG Drawing & Rings -->
    <div id="successModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-500">
        <div class="custom-container w-full max-w-md rounded-3xl p-8 text-center relative transform scale-90 translate-y-4 transition-all duration-500 shadow-2xl" id="successCard">
            
            <button id="closeModalBtn" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors cursor-pointer">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <!-- Elaborate Success Animation Container -->
            <div class="w-24 h-24 mx-auto mb-6 rounded-full bg-gradient-to-tr from-indigo-500/20 to-purple-500/25 border border-indigo-500/30 flex items-center justify-center relative shadow-inner">
                <div class="success-ring"></div>
                <svg class="w-12 h-12 text-indigo-400 svg-check" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 13l4 4L19 7"></path>
                </svg>
            </div>

            <h3 class="text-2xl font-extrabold mb-2 text-white">Message Sent</h3>
            <p class="text-sm opacity-60 mb-8 leading-relaxed">Thank you. Your message has been successfully submitted.</p>

            <button 
                id="modalDoneBtn"
                class="w-full py-3.5 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm transition-all shadow-lg cursor-pointer"
            >
                Done
            </button>
        </div>
    </div>

    <!-- Toasts -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme Logic
            const themeButtons = document.querySelectorAll('[data-theme-btn]');
            const htmlElement = document.documentElement;

            const setTheme = (themeName) => {
                htmlElement.setAttribute('data-theme', themeName);
                themeButtons.forEach(btn => {
                    if (btn.getAttribute('data-theme-btn') === themeName) {
                        btn.className = 'px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-indigo-600 text-white shadow-lg cursor-pointer';
                    } else {
                        btn.className = 'px-3 py-1.5 rounded-xl text-xs font-semibold transition-all opacity-60 hover:opacity-100 cursor-pointer';
                    }
                });
                localStorage.setItem('masterclass_theme', themeName);
            };

            const savedTheme = localStorage.getItem('masterclass_theme') || 'glass';
            setTheme(savedTheme);

            themeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    setTheme(btn.getAttribute('data-theme-btn'));
                    triggerHaptic();
                });
            });

            // Particles
            const particleContainer = document.getElementById('particleContainer');
            for (let i = 0; i < 22; i++) {
                const p = document.createElement('div');
                p.className = 'particle bg-indigo-500/20';
                const size = Math.random() * 6 + 2;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}vw`;
                p.style.top = `${Math.random() * 100 + 100}vh`;
                p.style.animationDuration = `${Math.random() * 12 + 8}s`;
                p.style.animationDelay = `${Math.random() * 5}s`;
                particleContainer.appendChild(p);
            }

            // Form Variables
            const form = document.getElementById('contactForm');
            const firstNameInput = document.getElementById('firstName');
            const lastNameInput = document.getElementById('lastName');
            const emailInput = document.getElementById('email');
            const messageInput = document.getElementById('message');
            const charCounter = document.getElementById('charCounter');

            const submitBtn = document.getElementById('submitBtn');
            const btnContent = document.getElementById('btnContent');
            const btnSpinner = document.getElementById('btnSpinner');

            const successModal = document.getElementById('successModal');
            const successCard = document.getElementById('successCard');

            const triggerHaptic = () => {
                if (window.navigator && typeof window.navigator.vibrate === 'function') window.navigator.vibrate(15);
            };

            // Time Status
            const localTimeDisplay = document.getElementById('localTimeDisplay');
            const updateLocalTime = () => {
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes().toString().padStart(2, '0');
                localTimeDisplay.textContent = `${hours % 12 || 12}:${minutes} ${hours >= 12 ? 'PM' : 'AM'}`;
            };
            updateLocalTime();
            setInterval(updateLocalTime, 30000);

            messageInput.addEventListener('input', () => {
                const len = messageInput.value.length;
                charCounter.textContent = `${len} / 500`;
                if (len > 450) {
                    charCounter.classList.add('text-amber-500');
                    charCounter.classList.remove('opacity-50');
                } else {
                    charCounter.classList.remove('text-amber-500');
                    charCounter.classList.add('opacity-50');
                }
            });

            const showToast = (message, type = 'success') => {
                const toast = document.createElement('div');
                toast.className = `pointer-events-auto px-4 py-3 rounded-2xl custom-container text-sm shadow-2xl flex items-center gap-3 transform translate-y-4 opacity-0 transition-all duration-300 border ${type === 'error' ? 'border-rose-500/50 bg-rose-950/40 text-white' : 'border-indigo-500/50 bg-indigo-950/40 text-white'}`;
                toast.innerHTML = `<span class="w-2 h-2 rounded-full ${type === 'error' ? 'bg-rose-400' : 'bg-indigo-400'}"></span><span>${message}</span>`;
                document.getElementById('toastContainer').appendChild(toast);
                requestAnimationFrame(() => toast.classList.remove('translate-y-4', 'opacity-0'));
                setTimeout(() => {
                    toast.classList.add('translate-y-4', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            };

            const validateEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                triggerHaptic();

                let isValid = true;
                if (!firstNameInput.value.trim() || !lastNameInput.value.trim() || !validateEmail(emailInput.value.trim()) || messageInput.value.trim().length < 10) {
                    isValid = false;
                }

                if (!isValid) return showToast('Please check all fields and try again.', 'error');

                // Advanced Button Animation: State 1 (Sending)
                submitBtn.classList.add('is-sending');
                btnContent.classList.add('opacity-0');
                btnSpinner.classList.remove('opacity-0');

                try {
                    // Optional Google reCAPTCHA Enterprise
                    let token = '';
                    if (typeof grecaptcha !== 'undefined' && grecaptcha.enterprise) {
                        token = await new Promise((resolve) => {
                            grecaptcha.enterprise.ready(async () => {
                                resolve(await grecaptcha.enterprise.execute('6LdTMBYuAAAAAGUZD2Iy6lFprt3IXAKuEOe3cWyV', { action: 'submit_contact' }));
                            });
                        });
                    }

                    // FormSubmit AJAX Payload
                    const payload = {
                        first_name: firstNameInput.value.trim(),
                        last_name: lastNameInput.value.trim(),
                        email: emailInput.value.trim(),
                        message: messageInput.value.trim(),
                        _subject: "New Submission: Masterclass Contact",
                        _template: "box", 
                        _captcha: "false"
                    };

                    const response = await fetch('https://formsubmit.co/ajax/koirala57111@gmail.com', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        // Advanced Button Animation: State 2 (Success Fly Away)
                        btnSpinner.classList.add('opacity-0');
                        submitBtn.classList.add('is-success');
                        
                        // Wait for paper plane animation to finish before showing modal
                        setTimeout(() => {
                            successModal.classList.remove('opacity-0', 'pointer-events-none');
                            successModal.classList.add('modal-active');
                            successCard.classList.remove('scale-90', 'translate-y-4');
                            successCard.classList.add('scale-100', 'translate-y-0');
                            
                            form.reset();
                            charCounter.textContent = '0 / 500';
                            
                            // Reset button quietly in background
                            setTimeout(() => {
                                submitBtn.classList.remove('is-sending', 'is-success');
                                btnContent.classList.remove('opacity-0');
                            }, 500);
                        }, 1000);

                    } else {
                        showToast('Submission failed. Please try again.', 'error');
                        submitBtn.classList.remove('is-sending');
                        btnContent.classList.remove('opacity-0');
                        btnSpinner.classList.add('opacity-0');
                    }
                } catch (error) {
                    console.error(error);
                    showToast('Network error. Please check your connection.', 'error');
                    submitBtn.classList.remove('is-sending');
                    btnContent.classList.remove('opacity-0');
                    btnSpinner.classList.add('opacity-0');
                }
            });

            const closeSuccessModal = () => {
                successModal.classList.add('opacity-0', 'pointer-events-none');
                successModal.classList.remove('modal-active');
                successCard.classList.add('scale-90', 'translate-y-4');
                successCard.classList.remove('scale-100', 'translate-y-0');
            };

            document.getElementById('closeModalBtn').addEventListener('click', closeSuccessModal);
            document.getElementById('modalDoneBtn').addEventListener('click', closeSuccessModal);
            successModal.addEventListener('click', (e) => { if (e.target === successModal) closeSuccessModal(); });
        });
    </script>
</body>
</html>
